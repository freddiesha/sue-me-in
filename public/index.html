<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sue Me, Inc.</title>
<meta name="description" content="Sue Me, Inc. A law firm tycoon game.">
<meta name="theme-color" content="#3a6ea5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sue Me">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one Windows 2000 application window on the classic blue desktop. Animated office cutaway on top, firm stats, a big default button, property-sheet tabs, then a news box and status bar. */
:root{
 --desk:#3a6ea5;--face:#d4d0c8;--hi:#ffffff;--sh:#808080;--dk:#404040;--ink:#000000;--field:#ffffff;
 --t1:#0a246a;--t2:#a6caf0;--ti:#ffffff;--sel:#0a246a;--selt:#ffffff;
 --good:#006b00;--bad:#b00000;--scrim:rgba(0,0,0,.35);
 --wood:#8a5a2a;--wood2:#5b3716;--i-info:#1c5bd6;--i-warn:#f2c200;--i-stop:#d42020;--i-glyph:#ffffff;--i-glyph2:#000000;
 --para:#c9a36b;--assoc:#4f86d0;--part:#2a2c33;
 --ui:Tahoma,Verdana,"Segoe UI",Geneva,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#10253e;--face:#3d3c39;--hi:#6c6a65;--sh:#24231f;--dk:#0d0d0c;--ink:#ece8df;--field:#1f1e1c;--t2:#3d6fa8;--sel:#3d6fa8;--good:#6fdc6f;--bad:#ff8574;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--desk:#10253e;--face:#3d3c39;--hi:#6c6a65;--sh:#24231f;--dk:#0d0d0c;--ink:#ece8df;--field:#1f1e1c;--t2:#3d6fa8;--sel:#3d6fa8;--good:#6fdc6f;--bad:#ff8574;--scrim:rgba(0,0,0,.55);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:13px/1.35 var(--ui);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent}
small{font-size:11px;opacity:.78}
.win{max-width:520px;margin:0 auto;background:var(--face);padding:3px;box-shadow:inset 1px 1px var(--face),inset -1px -1px var(--dk),inset 2px 2px var(--hi),inset -2px -2px var(--sh),2px 3px 10px rgba(0,0,0,.35)}
.tb{display:flex;align-items:center;gap:5px;height:24px;padding:0 3px 0 5px;background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--ti);font-weight:700}
.tb .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb svg.app{flex:none}
.ctl{display:flex;gap:0}
.ctl span{width:18px;height:16px;display:grid;place-items:center;background:var(--face);color:var(--ink);box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--dk),inset -2px -2px var(--sh)}
.ctl span:last-child{margin-left:2px}
.menu{display:flex;padding:2px 0}
.menu button{background:none;border:0;padding:5px 9px;min-height:30px}
.menu button:active{background:var(--sel);color:var(--selt)}
.tools{display:flex;align-items:center;gap:1px;padding:3px 2px;border-top:1px solid var(--sh);box-shadow:inset 0 1px var(--hi);border-bottom:1px solid var(--sh)}
.tool{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:4px 9px;min-height:34px;cursor:pointer}
.tool:active{box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi)}
.tool.on{box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi);background:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px}
.sep{width:2px;align-self:stretch;margin:3px 4px;box-shadow:inset 1px 0 var(--sh),inset -1px 0 var(--hi)}
.scene{margin:6px 2px;padding:2px;box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi),inset 2px 2px var(--dk),inset -2px -2px var(--face)}
#cv{display:block;width:100%;max-width:100%;aspect-ratio:360/240;cursor:pointer}
#cv:focus-visible{outline:1px dotted var(--ink);outline-offset:2px}
.grp{margin:8px 2px;padding:6px 8px 8px;border:1px solid var(--sh);box-shadow:1px 1px 0 var(--hi),inset 1px 1px 0 var(--hi)}
.grp legend{padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.st small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--good)}
.btn{background:var(--face);border:0;padding:5px 12px;min-height:34px;cursor:pointer;box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--dk),inset -2px -2px var(--sh);white-space:nowrap}
.btn:active:not(:disabled){box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi),inset 2px 2px var(--sh);padding:6px 11px 4px 13px}
.btn:disabled{color:var(--sh);text-shadow:1px 1px var(--hi);cursor:default}
.btn:focus-visible,.tool:focus-visible,.tab:focus-visible,.menu button:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
.btn.sm{min-height:30px;padding:3px 9px}
.btn.big{display:flex;width:calc(100% - 4px);margin:0 2px;align-items:center;justify-content:center;gap:8px;min-height:50px;font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1px var(--dk),inset 2px 2px var(--hi),inset -2px -2px var(--dk),inset -3px -3px var(--sh)}
.btn.big:active{box-shadow:inset 0 0 0 1px var(--dk),inset 2px 2px var(--sh);padding:6px 11px 4px 13px}
.tabs{display:flex;margin:10px 2px 0;padding-left:2px;position:relative;z-index:1}
.tab{background:var(--face);border:0;padding:6px 12px;margin-top:3px;min-height:32px;border-radius:3px 3px 0 0;box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset -2px 0 var(--sh)}
.tab.on{margin:0 -2px -2px;padding:7px 14px 10px;position:relative;z-index:2}
.sheet{margin:0 2px;padding:10px 8px 8px;box-shadow:inset 1px 1px var(--hi),inset -1px -1px var(--dk),inset -2px -2px var(--sh)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sub{font-weight:700;margin:10px 0 4px}
.field{background:var(--field);box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi),inset 2px 2px var(--dk),inset -2px -2px var(--face);padding:2px}
.li{padding:7px 6px;border-bottom:1px solid var(--face)}
.li:last-child{border-bottom:0}
.li.sel{background:var(--sel);color:var(--selt)}
.lt{display:flex;justify-content:space-between;gap:8px}
.lt span{font-variant-numeric:tabular-nums}
.sr{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:14px;margin:4px 0 3px;padding:2px;background:var(--field);box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sel) 0 7px,transparent 7px 9px)}
.li.sel .bar{box-shadow:none}
.badge{flex:none;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--i-glyph);box-shadow:inset 1px 1px rgba(255,255,255,.45),inset -1px -1px rgba(0,0,0,.45)}
.badge.para{background:var(--para);color:var(--i-glyph2)}.badge.assoc{background:var(--assoc)}.badge.part{background:var(--part)}
.attrs{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;margin-top:3px}
.pips i{display:inline-block;width:5px;height:8px;margin-left:1px;background:var(--field);box-shadow:inset 0 0 0 1px var(--sh);vertical-align:-1px}
.pips i.on{background:var(--sel);box-shadow:none}
.news{min-height:4.6em;padding:4px 6px;font-size:12px}
.news div+div{opacity:.7}
.status{display:flex;gap:2px;margin:4px 0 0}
.status span{flex:1;min-width:0;padding:3px 5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi)}
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dw{width:100%;max-width:370px;background:var(--face);padding:3px;box-shadow:inset 1px 1px var(--face),inset -1px -1px var(--dk),inset 2px 2px var(--hi),inset -2px -2px var(--sh),3px 4px 14px rgba(0,0,0,.4)}
.dbody{display:flex;gap:12px;align-items:flex-start;padding:16px 12px 12px}
.ic{flex:none;width:32px;height:32px}
.dbody p{margin:0;flex:1;min-width:0;white-space:pre-line;line-height:1.45}
.dbtns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px 12px}
.dbtns .btn{min-width:84px}
.dbtns.col{flex-direction:column;align-items:stretch}
.dbtns.col .btn{white-space:normal;text-align:left}
#ii{display:block;width:calc(100% - 24px);margin:0 12px 12px;font:inherit;font-size:16px;padding:6px;color:var(--ink);background:var(--field);border:0;box-shadow:inset 1px 1px var(--sh),inset -1px -1px var(--hi),inset 2px 2px var(--dk),inset -2px -2px var(--face);-webkit-user-select:text;user-select:text;border-radius:0}
#ii:focus{outline:1px dotted var(--ink);outline-offset:2px}
@media (max-width:380px){.tool span{display:none}.tool{padding:4px 11px}}

/* page base */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="win">
 <div class="tb">
  <svg class="app" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v11M4.5 14h7M2.5 4h11" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M2.5 4 .6 9h3.8zM13.5 4l-1.9 5h3.8z" fill="currentColor"/></svg>
  <span class="nm" id="ttl">Sue Me, Inc.</span>
  <span class="ctl" aria-hidden="true">
   <span><svg viewBox="0 0 8 7" width="8" height="7"><rect x="0" y="5" width="6" height="2" fill="currentColor"/></svg></span>
   <span><svg viewBox="0 0 9 9" width="9" height="9"><path d="M.5 1.5h8v7h-8z" fill="none" stroke="currentColor"/><rect x="0" y="1" width="9" height="2" fill="currentColor"/></svg></span>
   <span><svg viewBox="0 0 8 7" width="8" height="7"><path d="M0 0h2l2 2.5L6 0h2L5 3.5 8 7H6L4 4.5 2 7H0l3-3.5z" fill="currentColor"/></svg></span>
  </span>
 </div>
 <div class="menu">
  <button data-a="menu"><u>G</u>ame</button>
  <button data-a="help"><u>H</u>elp</button>
 </div>
 <div class="tools">
  <button class="tool" data-a="pause" id="pause" aria-label="Pause"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3" y="2" width="4" height="12" fill="currentColor"/><rect x="9" y="2" width="4" height="12" fill="currentColor"/></svg><span>Pause</span></button>
  <button class="tool" data-a="spd:1" id="s1" aria-label="Normal speed"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2l9 6-9 6z" fill="currentColor"/></svg><span>1x</span></button>
  <button class="tool" data-a="spd:3" id="s3" aria-label="Fast speed"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1 2l7 6-7 6zM8 2l7 6-7 6z" fill="currentColor"/></svg><span>3x</span></button>
  <span class="sep" aria-hidden="true"></span>
  <button class="tool" data-a="help" aria-label="How to play"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7" style="fill:var(--i-info)"/><text x="8" y="12" text-anchor="middle" font-size="11" font-weight="700" font-family="Tahoma,Verdana,sans-serif" style="fill:var(--i-glyph)">?</text></svg><span>Help</span></button>
 </div>

 <div class="scene"><canvas id="cv" width="360" height="230" role="button" tabindex="0" aria-label="Your office. Tap to bill hours, or tap someone to see their name."></canvas></div>

 <fieldset class="grp"><legend>Firm</legend><div class="stats" id="stats"></div></fieldset>

 <button class="btn big" data-a="work" id="work"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><g transform="rotate(-38 12 12)"><rect x="5" y="4" width="11" height="6" rx="1" style="fill:var(--wood)"/><rect x="4" y="3" width="2.2" height="8" style="fill:var(--wood2)"/><rect x="14.8" y="3" width="2.2" height="8" style="fill:var(--wood2)"/><rect x="9.3" y="10" width="2.4" height="12" style="fill:var(--wood)"/></g></svg><span id="worklbl">Bill hours</span></button>

 <div class="tabs" role="tablist">
  <button class="tab on" data-a="tab:cases" role="tab">Cases</button>
  <button class="tab" data-a="tab:staff" role="tab">Staff</button>
  <button class="tab" data-a="tab:office" role="tab">Office</button>
 </div>
 <div class="sheet">
  <div id="p-cases"></div>
  <div id="p-staff" hidden></div>
  <div id="p-office" hidden></div>
 </div>

 <fieldset class="grp"><legend>Firm news</legend><div id="log" class="field news" aria-live="polite"></div></fieldset>
 <div class="status"><span id="sb1"></span><span id="sb2"></span><span id="sb3"></span></div>
</div>

<div id="dlg" class="ov" hidden>
 <div class="dw" role="dialog" aria-modal="true" aria-labelledby="dt">
  <div class="tb"><span class="nm" id="dt"></span></div>
  <div class="dbody"><span class="ic" id="di"></span><p id="dm"></p></div>
  <div class="dbtns" id="db"></div>
 </div>
</div>
<div id="intro" class="ov" hidden>
 <div class="dw" role="dialog" aria-modal="true" aria-labelledby="it">
  <div class="tb"><span class="nm" id="it"></span></div>
  <div class="dbody"><span class="ic" id="iic"></span><p id="im"></p></div>
  <input id="ii" maxlength="28" placeholder="Dewey, Cheatem &amp; Howe" autocomplete="off" aria-label="Firm name" hidden>
  <div class="dbtns" id="ib"></div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id),fmt=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STAFF={
 para:{n:'Paralegal',cost:800,sal:300,out:1},
 assoc:{n:'Associate',cost:3500,sal:1200,out:3.5},
 part:{n:'Partner',cost:15000,sal:4500,out:10}
};
const OFFICES=[
 {n:'Basement Office',rent:200,cost:0},
 {n:'Strip Mall Suite',rent:900,cost:6000},
 {n:'Downtown Floors',rent:3200,cost:45000},
 {n:'Glass Skyscraper',rent:10000,cost:300000}
];
const UPG={
 pc:{n:'Pentium PC',d:'Each tap bills 2 more hours.',cost:1500},
 lib:{n:'Law Library',d:'Staff output +20%.',cost:5000},
 cof:{n:'Coffee Machine',d:'Staff output +10%.',cost:900},
 fax:{n:'Fax Machine',d:'Room for 2 more waiting clients.',cost:600}
};
const CASES=[
 {n:'Parking Ticket',w:6,f:200,r:0},
 {n:'Fender Bender',w:14,f:520,r:0},
 {n:'Tamagotchi Custody Battle',w:25,f:900,r:4},
 {n:'Messy Divorce',w:40,f:1800,r:10},
 {n:'Slip-and-Fall',w:70,f:3600,r:22},
 {n:'Dot-Com Patent War',w:160,f:10000,r:45},
 {n:'Class Action',w:350,f:26000,r:80},
 {n:'Corporate Merger',w:800,f:70000,r:140}
];
const KEY='sueme-v1';
let S,L=[],tab='cases',timer,SK='',lastTickAt=0;
const fresh=()=>({name:'',cash:1500,rep:0,day:0,team:[],cands:[],lastCard:0,nid:1,office:0,up:{},ads:0,q:[],won:false,over:false,spd:1,paused:false,done:0});
const cap=()=>8*(S.office+1);
const heads=()=>S.team.length;
const mult=()=>1+(S.up.lib?.2:0)+(S.up.cof?.1:0);
const out=()=>S.team.reduce((a,m)=>a+STAFF[m.k].out*(.6+.2*m.sk),0)*mult();
const click=()=>1+(S.up.pc?2:0);
const qcap=()=>4+S.office*2+(S.up.fax?2:0);
const FN=['Gordon','Dana','Chip','Marcy','Rick','Tina','Walt','Bev','Skip','Nadia','Lou','Penny','Doug','Renata','Vince','Alma'];
const LN=['Buckner','Okafor','Delgado','Pruitt','Nakamura','Kowalski','Fitch','Abernathy','Voss','Sinclair','Mbeki','Tate'];
const rnd=n=>1+Math.floor(Math.random()*n);
function cand(){
 const r=Math.random(),k=r<.5?'para':r<.85?'assoc':'part',s=STAFF[k],sk=rnd(5);
 return{id:S.nid++,k,name:FN[rnd(FN.length)-1]+' '+LN[rnd(LN.length)-1],sk,ch:rnd(5),lo:rnd(5),sal:Math.round(s.sal*(.7+.15*sk)/10)*10,cost:Math.round(s.cost*(.6+.2*sk)/10)*10};
}
const pips=v=>'<span class="pips">'+[1,2,3,4,5].map(i=>'<i'+(i<=v?' class="on"':'')+'></i>').join('')+'</span>';
const mrow=(m,btn)=>`<div class="li sr"><span class="badge ${m.k}" aria-hidden="true">${STAFF[m.k].n[0]}</span><div class="grow"><b>${m.name}</b> <small>${STAFF[m.k].n}, ${fmt(m.sal)}/mo</small><div class="attrs"><span>Skill ${pips(m.sk)}</span><span>Charm ${pips(m.ch)}</span><span>Loyalty ${pips(m.lo)}</span></div></div>${btn}</div>`;
function buildStaff(){
 $('p-staff').innerHTML='<div class="hdr"><span id="seats"></span><button class="btn sm" id="post" data-a="post">Post job, $200</button></div><div class="sub">Applicants</div><div class="field">'
  +S.cands.map(c=>mrow(c,`<button class="btn sm hb" data-a="hire:${c.id}" data-c="${c.cost}">Hire ${fmt(c.cost)}</button>`)).join('')
  +'</div><div class="sub">Your team ('+S.team.length+')</div><div class="field">'
  +(S.team.length?S.team.map(m=>mrow(m,`<button class="btn sm fb" data-a="fire:${m.id}" data-c="${m.sal}">Fire</button>`)).join(''):'<div class="li"><small>Nobody yet. Hire your first employee above.</small></div>')+'</div>';
}
const drop=(p,msg)=>{BYE[p.id]=msg||'So long!';S.team=S.team.filter(x=>x!==p)};
const CARDS=[
 {c:()=>S.done>=3,t:'Big client walking out',m:()=>'Marcus Webb, your biggest client, is furious about slow billing. He is on the phone with Hartwell, Pike & Lowe.',o:[
  ['Comp him a free month ($2,000)',2000,()=>Math.random()<.75?(S.rep+=5,'Marcus is thrilled and tells everyone at the country club. Reputation +5.'):'He takes the freebie and leaves anyway. Ouch.'],
  ['Put a partner on his account (needs a partner)',0,()=>{const p=S.team.find(m=>m.k==='part');p.lo=Math.max(1,p.lo-1);S.cash+=3000;return p.name+' charms Marcus into a $3,000 retainer, but resents the extra work (loyalty -1).'},()=>S.team.some(m=>m.k==='part')],
  ['Let him walk',0,()=>{S.rep=Math.max(0,S.rep-3);S.q.shift();LEAVE.push('Hmph!');return 'Marcus storms out with his files. Reputation -3 and your top case is gone.'}]]},
 {c:()=>S.team.length>0,t:'Rival firm poaching',m:p=>'Hartwell, Pike & Lowe offered '+p.name+' a corner office. '+p.name+' wants to know what you will do about it.',o:[
  ['Match the offer (+30% salary)',0,p=>{p.sal=Math.round(p.sal*1.3/10)*10;p.lo=Math.min(5,p.lo+1);return p.name+' stays, happier and pricier.'}],
  ['Counter with a $1,500 bonus',1500,p=>Math.random()<.6?(p.lo=Math.min(5,p.lo+1),p.name+' pockets the bonus and stays.'):(drop(p),p.name+' takes the bonus and the rival’s offer anyway.')],
  ['Wish them luck',0,p=>(drop(p),p.name+' leaves on good terms.')]]},
 {c:()=>S.day>=45,t:'Bar association audit',m:()=>'An inspector arrives unannounced and asks to see your books.',o:[
  ['Hire an accountant ($1,200)',1200,()=>{S.rep+=1;return 'The audit finds nothing. Reputation +1.'}],
  ['Wing it',0,()=>Math.random()<.5?(S.rep+=1,'You bluff your way through. Reputation +1.'):(S.cash-=3000,S.rep=Math.max(0,S.rep-3),'The inspector finds a mess. Fined $3,000 and reputation -3.')]]},
 {c:()=>S.rep>=3,t:'Pro bono plea',m:()=>'A widow cannot afford a lawyer and the landlord is evicting her. The local paper is watching.',o:[
  ['Take the case',0,()=>{S.cash-=Math.min(S.cash,500);S.rep+=5;return 'The paper loves it. Reputation +5, but you lose $500 in billable time.'}],
  ['Refer her to legal aid',0,()=>'You pass her along. Nobody notices.']]},
 {c:()=>S.rep>=8,t:'Shady developer',m:()=>'A developer offers $8,000 to quietly lose some paperwork at the county office.',o:[

 const sg=g.createLinearGradient(0,WALL,0,WALL+9);sg.addColorStop(0,'rgba(0,0,0,.18)');sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.fillRect(0,WALL,lw,9);
}
function draw(now){
 const t=RM?0:now,o=S.office,sc=LY.sc,lw=LY.lw,lh=LY.lh;
 g.setTransform(dpr*sc,0,0,dpr*sc,0,0);
 const iv=S.spd===3?330:1000,frac=(!S.paused&&!S.over)?Math.min(1,(performance.now()-lastTickAt)/iv):0,h=((S.day+frac)/2)%24,nf=night(h),typ=!S.paused&&!S.over&&S.q.length>0;
 wallD(t,h,nf);floorD();
 const D=[],bySlot=new Map();
 AG.forEach(a=>{if(a.mode==='sit'&&!a.gone)bySlot.set(a.slot,a)});
 LY.desks.forEach((d,i)=>D.push([d.y,()=>deskD(d,bySlot.get(i),t,typ,now)]));
 AG.forEach(a=>{if(a.mode!=='sit')D.push([a.y,()=>walker(a.x,a.y,a.look,a.mode==='walk'?a.ph:0,a.dir,{cup:a.carry||(a.mode==='break'&&a.spotK==='coffee'&&now>a.until-2),back:a.mode==='walk'&&a.back,bt:t+a.ph})])});
 const seats=LY.seats.slice(0,Math.min(LY.seats.length,qcap())),occ=new Map();
 CL.forEach(c=>{if(c.mode==='sit')occ.set(c.seat,c)});
 seats.forEach((s,i)=>D.push([s.y,()=>waitChair(s.x,s.y,occ.get(i),o,t)]));
 CL.forEach(c=>{if(c.mode!=='sit')D.push([c.y,()=>walker(c.x,c.y,c.look,c.ph,c.dir,{bag:1,back:c.back,bt:t+c.ph})])});
 LY.items.forEach(it=>D.push([it.y,()=>item(it,t)]));
 D.sort((a,b)=>a[0]-b[0]).forEach(d=>d[1]());
 if(o===0&&!RM&&Math.sin(t*13)+Math.sin(t*7.3)<-1.6){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,0,lw,lh)}
 if(nf>0){g.fillStyle='rgba(25,30,80,'+(nf*.1)+')';g.fillRect(0,0,lw,lh)}
 if(o===2&&nf>.2)LY.desks.forEach(d=>{const lg=g.createRadialGradient(d.x-13.5,d.y-20,1,d.x-13.5,d.y-20,16);lg.addColorStop(0,'rgba(255,225,140,'+(nf*.35)+')');lg.addColorStop(1,'rgba(255,225,140,0)');g.fillStyle=lg;g.fillRect(d.x-30,d.y-36,33,33)});
 let eg=g.createLinearGradient(0,0,8,0);eg.addColorStop(0,'rgba(0,0,0,.28)');eg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=eg;g.fillRect(0,0,8,lh);
 eg=g.createLinearGradient(lw,0,lw-8,0);eg.addColorStop(0,'rgba(0,0,0,.28)');eg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=eg;g.fillRect(lw-8,0,8,lh);
 // overlay in screen pixels: speech bubbles, name tooltips, floating numbers
 g.setTransform(dpr,0,0,dpr,0,0);
 const BB=[];
 AG.forEach(a=>{const Y=(a.mode==='sit'?a.y-37:a.y-30)*sc,X=a.x*sc;if(a.tagT>now)BB.push([X,Y,a.tag,1]);else if(a.bt>now)BB.push([X,Y,a.bub,0])});
 CL.forEach(c=>{if(c.bt>now)BB.push([c.x*sc,(c.mode==='sit'?c.y-28:c.y-30)*sc,c.bub,0])});
 g.font='bold 9px '+FONT;g.textBaseline='middle';g.textAlign='center';g.lineWidth=1;
 BB.forEach(([X,Y,s,tip])=>{
  const tw=Math.ceil(g.measureText(s).width)+8,bx=Math.round(Math.max(2,Math.min(W-tw-2,X-tw/2)))+.5,by=Math.round(Math.max(2,Y-14))+.5;
  g.fillStyle=tip?'#ffffe1':'#ffffff';g.strokeStyle='#000000';rr(bx,by,tw,13,tip?.01:4);g.fill();g.stroke();
  if(!tip){const tx=Math.max(bx+5,Math.min(bx+tw-5,X));g.beginPath();g.moveTo(tx-3,by+12.5);g.lineTo(tx,by+17);g.lineTo(tx+3,by+12.5);g.fill();g.beginPath();g.moveTo(tx-3,by+13);g.lineTo(tx,by+17);g.lineTo(tx+3,by+13);g.stroke()}
  g.fillStyle='#000000';g.fillText(s,bx+tw/2,by+7);
 });
 g.textAlign='left';g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.7)';
 if(S.q.length>seats.length){const s='+'+(S.q.length-seats.length)+' waiting';g.strokeText(s,4,H-8);g.fillStyle='#ffffff';g.fillText(s,4,H-8)}
 if(S.paused&&!S.over){const s='Paused',tw=g.measureText(s).width+8;g.lineWidth=1;g.fillStyle='#ffffe1';g.strokeStyle='#000000';g.fillRect(W-tw-4.5,4.5,tw,14);g.strokeRect(W-tw-4.5,4.5,tw,14);g.fillStyle='#000000';g.fillText(s,W-tw-.5,12)}
 FL=FL.filter(f=>now-f.t0<1.6);
 g.textAlign='center';g.font='bold 10px '+FONT;g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.75)';
 FL.forEach(f=>{const a=(now-f.t0)/1.6,y=f.y-a*22;g.globalAlpha=1-a*a;g.strokeText(f.s,f.x,y);g.fillStyle=f.c;g.fillText(f.s,f.x,y)});
 g.globalAlpha=1;g.textAlign='left';g.textBaseline='alphabetic';
}
let lastF=0;
function frame(ms){const now=ms/1000,dt=lastF?Math.min(.1,now-lastF):0;lastF=now;if(S&&!document.hidden){layout();upd(now,dt);draw(now)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
cv.addEventListener('click',e=>{
 if(!S||S.over)return;
 const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*W,Y=(e.clientY-r.top)/r.height*H;
 if(LY){const lx=X/LY.sc,ly=Y/LY.sc;let best=null,bd=14;AG.forEach(a=>{if(a.gone)return;const dd=Math.hypot(lx-a.x,ly-(a.mode==='sit'?a.y-26:a.y-14));if(dd<bd){bd=dd;best=a}});if(best){best.tag=best.m.name+', '+STAFF[best.m.k].n;best.tagT=performance.now()/1000+2.2}}
 billable(X,Y);
});
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();billable()}});

function render(){
 const cell=(a,b,c)=>`<div class="st"><small>${a}</small><b${c?' class="'+c+'"':''}>${b}</b></div>`,dl=30-S.day%30;
 $('stats').innerHTML=cell('Cash',fmt(S.cash),S.cash<pay()?'neg':'')+cell('Reputation',S.rep)+cell('Hours/day',+out().toFixed(1))
  +cell('Date',MON[Math.floor(S.day/30)%12]+' '+(1995+Math.floor(S.day/360)))+cell('Payday in '+dl+'d',fmt(-pay()),'neg')+cell('Cases won',S.done);
 $('p-cases').innerHTML=`<div class="hdr"><span>Clients waiting: ${S.q.length} of ${qcap()}</span></div><div class="field">`+(S.q.length?S.q.map((c,i)=>`<div class="li${i?'':' sel'}"><div class="lt"><b>${c.n}</b><span>${fmt(c.f)}</span></div><div class="bar"><i style="width:${Math.min(100,c.p/c.w*100)}%"></i></div><small>${i?'Waiting':'In progress'}, ${c.t} days left, ${Math.ceil(c.w-c.p)} hrs to go</small></div>`).join(''):'<div class="li"><small>No clients waiting. Reputation and TV ads bring more.</small></div>')+'</div>';
 $('worklbl').textContent='Bill hours (+'+click()+')';
 const key=S.team.map(m=>m.id+':'+m.sal+m.lo).join()+'|'+S.cands.map(c=>c.id).join();if(key!==SK){SK=key;buildStaff()}
 document.querySelectorAll('.hb').forEach(b=>{b.disabled=S.cash<+b.dataset.c||heads()>=cap()});
 document.querySelectorAll('.fb').forEach(b=>{b.disabled=S.cash<+b.dataset.c});
 $('post').disabled=S.cash<200;
 $('seats').textContent='Desks used: '+heads()+' of '+cap();
 const o=OFFICES[S.office],n=OFFICES[S.office+1];
 $('ofn').textContent=o.n;$('ofd').textContent='Rent '+fmt(o.rent)+'/month, '+cap()+' desks, '+qcap()+' client slots.'+(n?' Next: '+n.n+'.':'');
 $('mv').textContent=n?'Move '+fmt(n.cost):'Top floor';$('mv').disabled=!n||S.cash<n.cost;
 for(const k in UPG){const b=$('u-'+k);b.textContent=S.up[k]?'Owned':fmt(UPG[k].cost);b.disabled=!!S.up[k]||S.cash<UPG[k].cost}
 $('adn').textContent='Late-Night TV Ad (bought '+S.ads+')';$('ad').textContent=fmt(adCost());$('ad').disabled=S.cash<adCost();
 const nm=S.name||'Sue Me, Inc.';$('ttl').textContent=nm+' - Law Firm Tycoon';document.title=nm;
 $('pause').querySelector('span').textContent=S.paused?'Resume':'Pause';$('pause').classList.toggle('on',S.paused);
 $('s1').classList.toggle('on',!S.paused&&S.spd===1);$('s3').classList.toggle('on',!S.paused&&S.spd===3);
 $('log').replaceChildren(...L.map(x=>{const d=document.createElement('div');d.textContent=x;return d}));
 $('sb1').textContent=S.over?'Closed':S.paused?'Paused':'Running at '+S.spd+'x';
 $('sb2').textContent=o.n;
 $('sb3').textContent='Staff '+heads()+'/'+cap();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const[a,k]=b.dataset.a.split(':');
 if(a==='work')billable();
 else if(a==='hire')hire(+k);
 else if(a==='fire')confirmFire(+k);
 else if(a==='up')up(k);
 else if(a==='ad')ad();
 else if(a==='post')post();
 else if(a==='move')move();
 else if(a==='tab')tabTo(k);
 else if(a==='help')dlg('How to play',HELP,[{t:'OK'}],false,'info');
 else if(a==='menu')dlg('Game','Start a new firm? This erases the current one.',[{t:'New firm',f:()=>newGame(false)},{t:'Cancel'}],false,'question');
 else if(a==='pause'){if(S.over)return;S.paused=!S.paused;loop();render()}
 else if(a==='spd'){if(S.over)return;S.spd=+k;S.paused=false;loop();render()}
});

function start(d){
 buildPanels();
 if(d&&d.S){S=d.S;L=d.L||[];render();tabTo(tab);if(!S.name){S.paused=true;intro(false)}else loop();return}
 let loaded=false;
 try{
  const r=localStorage.getItem(KEY);
  if(r){const o=JSON.parse(r);if(o&&!o.over){S=Object.assign(fresh(),o);if(o.staff){S.team=[];for(const k in o.staff)for(let i=0;i<o.staff[k];i++){const c=cand();c.k=k;c.sal=STAFF[k].sal;S.team.push(c)}delete S.staff}while(S.cands.length<4)S.cands.push(cand());S.paused=false;loaded=true;LOG('Welcome back'+(S.name?' to '+S.name:'')+'.');render();if(S.name)loop();else{S.paused=true;intro(false)}}}
 }catch(e){}
 if(!loaded)newGame(true);
}
try{window.claude?.hot?.snapshot?.(()=>({S,L}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
